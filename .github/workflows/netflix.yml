name: netflix workflow

on: 
    workflow_dispatch:


jobs:

    build:
        runs-on: ubuntu-latest

        steps:
            # step 1
            - name: checkout code
              uses: actions/checkout@v7.0.1

            # step 2
            - name: setup node
              uses: actions/setup-node@v7.0.0
              with:
                node-version: 24
              
            #step 3
            - name: install dependencies
              run: npm install

            #step 4
            - name: build
              run: npm run build

            #step 5
            - name: cmd
              run: pwd

            #step 6
            - name: aws login
              uses: aws-actions/configure-aws-credentials@v6.2.2
              with: 
                aws-access-key-id: ${{ secrets.AWS_KEY }}
                aws-secret-access-key: ${{ secrets.AWS_PASS }}
                aws-region: ap-south-1

            #step 7                
            - name: s3 check
              run: aws s3 sync --delete  ./dist/ s3://demo-bucket-web-com

